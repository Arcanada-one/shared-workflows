name: governance-diff-guard

# Fails a pull request that touches a governance path unless the PR body carries
# an explicit justification line:
#
#   GOVERNANCE-CHANGE: <at least 20 characters saying why>
#
# Governance paths are the ones an autonomous agent must not be able to rewrite
# silently: CI workflow definitions, CODEOWNERS, branch-protection config, the
# governance witness key and its verifier, and the credential/execution
# boundary. Routine dependency automation is exactly the traffic this is here to
# catch — a bot bumping an action SHA edits .github/workflows/, and that should
# never merge unremarked.
#
# Caller usage:
#   jobs:
#     governance:
#       uses: Arcanada-one/shared-workflows/.github/workflows/governance-diff-guard.yml@<sha>
#       permissions:
#         contents: read
#         pull-requests: read

on:
  workflow_call:
    inputs:
      extra_patterns:
        description: Newline-separated extra globs to treat as governance paths.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: governance-diff-guard
    # Literal, not an expression: an expression-computed runs-on did not
    # schedule against the self-hosted pool — the job reported the correct
    # labels via the API but sat queued indefinitely while sibling jobs with
    # literal labels ran normally (SEC-0039).
    runs-on: [self-hosted, linux, arcana-ai, docker, ci-general]
    steps:
      # The implementation is checked out from this trusted repo, never from the
      # pull request under inspection — a PR must not be able to edit its own guard.
      - name: Check out trusted guard implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Arcanada-one/shared-workflows
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .governance-guard

      - name: Evaluate changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXTRA: ${{ inputs.extra_patterns }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ] || [ "${PR}" = "null" ]; then
            echo "governance-diff-guard: not a pull request; nothing to inspect."
            exit 0
          fi

          gh api --paginate "repos/${REPO}/pulls/${PR}/files?per_page=100" \
            --jq '.[].filename' > changed.txt
          echo "changed files: $(wc -l < changed.txt)"

          gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""' > body.txt

          args=(--files changed.txt --body body.txt)
          if [ -n "${EXTRA//[[:space:]]/}" ]; then
            printf '%s\n' "$EXTRA" > extra-patterns.txt
            args+=(--patterns extra-patterns.txt)
          fi

          bash .governance-guard/scripts/governance-diff-guard.sh "${args[@]}"
